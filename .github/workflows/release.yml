on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      tags:
        description: 'Tags'
        required: false
        type: boolean
  release:
    types: [published]

env:
  NODE_VERSION: '24.16.0'

jobs:
  releases:
    name: Release Jam-Build-PropsDB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # 4.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # 4.1.0
        with:
          platforms: linux/amd64,linux/arm64
      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # 6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Print Go Info
        run: |
          whereis go
          go version
      - name: Set VERSION Env
        run: echo VERSION=$(basename ${GITHUB_REF}) >> ${GITHUB_ENV}
      - name: Setup Node deps
        run: |
          npm ci
          npx playwright install --with-deps
      - name: Setup Go deps
        run: |
          make deps
          make install-tools
      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # 4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # 6.1.0
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/jam-build-propsdb
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - name: Build and Load Locally
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # 7.2.0
        with:
          context: .
          load: true
          tags: propsdb-api:test
      - name: Run E2E Tests
        run: |
          # Setup the full compose container
          make DB_TYPE=mariadb docker-compose-clean
          # Start the full compose container
          make DB_TYPE=mariadb docker-compose-up WAIT=60
          # Run the e2e tests against the local container
          make test-e2e-js-local
          # Stop compose container
          make docker-compose-down
      - name: Build and Push to Dockerhub
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # 7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # 5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          short-description: "Jam-build propsdb-api service image: https://github.com/localnerve/jam-build-propsdb"
          repository: ${{ secrets.DOCKER_USERNAME }}/jam-build-propsdb
          readme-filepath: ./README.md
