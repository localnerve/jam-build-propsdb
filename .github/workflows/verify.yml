name: Verify
on:
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '24.16.0'

jobs:
  verify:
    runs-on: ubuntu-24.04
    name: 'Verify Jam-Build-PropsDB'
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
    - name: Setup Node ${{ env.NODE_VERSION }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # 6.4.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Setup Node deps
      run: |
        npm ci
        npx playwright install --with-deps
    - name: Setup Go deps
      run: |
        make deps
        make install-tools
    - name: Run Go Checks
      run: make check
    # Pre-pull is required because BuildKit cannot establish a remote session tunnel via testcontainers-go
    # Image Versions here MUST match Dockerfile and this runner must be amd64
    - name: Pre-pull base images
      run: |
        GO_V=$(grep -E '^go ' go.mod | cut -d' ' -f2)
        docker pull golang:${GO_V}-alpine --platform linux/amd64
        docker pull alpine:3.24 --platform linux/amd64
    - name: Run Playwright E2E
      run: make test-e2e-js-cover # This builds the cover test image
    - name: Run Go Unit
      run: make test-unit
    - name: Run Go Integration
      run: make test-integration
    - name: Run Go E2E
      run: make test-e2e